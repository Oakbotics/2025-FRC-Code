plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2025.3.1"
    id "com.diffplug.spotless" version "6.21.0"
    id "com.github.spotbugs" version "5.0.13"
    id "org.owasp.dependencycheck" version "8.2.1"
    id "checkstyle"
    id "pmd"
    id "jacoco"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define targets and deployable artifacts for RoboRIO.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)
            artifacts {
                frcJava(getArtifactTypeClass('FRCJavaArtifact')) { }
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Configure WPILib settings.
wpi.java.debugJni = false
def includeDesktopSupport = false

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration.
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Configure the Jar as a fat jar with a manifest for WPILib.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from sourceSets.main.allSource
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure deploy tasks.
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Inline string concatenation configuration.
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

// ----- Code Quality and Analysis Configuration -----

// Checkstyle configuration.
checkstyle {
    toolVersion = '10.12.3'
    configFile = file('config/checkstyle/checkstyle.xml')
}
tasks.withType(Checkstyle) {
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
}

// Spotless configuration for code formatting.
spotless {
    java {
        googleJavaFormat('1.15.0')
        // Uncomment to enforce formatting failures:
        // enforceCheck true
    }
}

// PMD configuration for static analysis.
pmd {
    toolVersion = '6.55.0'
    ruleSets = [] // Disable default rules if using custom rules.
    ruleSetFiles = files('config/pmd/ruleset.xml')
}
tasks.withType(Pmd) {
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
}

// SpotBugs configuration for bytecode analysis.
// Dynamically attempt to load either SpotBugsTaskJava or SpotBugsTask.
def spotbugsTaskClass = null
try {
    spotbugsTaskClass = Class.forName("com.github.spotbugs.SpotBugsTaskJava")
} catch(Exception e1) {
    try {
        spotbugsTaskClass = Class.forName("com.github.spotbugs.SpotBugsTask")
    } catch(Exception e2) {
        logger.warn("Neither SpotBugsTaskJava nor SpotBugsTask class could be found; skipping SpotBugs configuration.")
    }
}
if (spotbugsTaskClass != null) {
    tasks.withType(spotbugsTaskClass) {
        reports {
            xml.required.set(false)
            html.required.set(true)
        }
    }
}

// JaCoCo configuration for code coverage.
jacoco {
    toolVersion = "0.8.10"
}
test {
    finalizedBy jacocoTestReport
}
jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}
