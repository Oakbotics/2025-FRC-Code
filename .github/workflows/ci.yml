name: CI

on:
  push:
    branches:
      - Robot-master-Tugluke-CI
  pull_request:
    branches:
      - Robot-master-Tugluke-CI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your code
      - name: Checkout
        uses: actions/checkout@v3

      # 2) Set up Java 
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # 3) Cache Gradle packages for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) Make the Gradle wrapper script executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5) Build the code (and run tests) via Gradle
      - name: Build and test with Gradle
        run: ./gradlew build

#Checkout: Pulls down your code onto the runner.
#Set up Java: Installs a JDK that Gradle can use.
#Cache Gradle: Speeds up subsequent builds by caching dependencies.
#Make gradlew executable: On Linux/macOS runners, the Gradle wrapper needs chmod +x gradlew.
#Gradle build: Actually runs the build command, so you can see if your code compiles and tests pass.