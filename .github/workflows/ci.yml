name: CI Pipeline

# Trigger the workflow on pushes, pull requests, and allow manual dispatch
on:
  push:
    branches:
      - Robot-master-Tugluke-CI
  pull_request:
    branches:
      - Robot-master-Tugluke-CI
  workflow_dispatch:  # Enables manual triggering from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      # Step 1: Check out the repository code so that the workflow can access it
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 17 on the runner using Temurin
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # Step 3: Cache Gradle dependencies to speed up builds on runs
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: Make sure the Gradle wrapper (gradlew) has execute permissions
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Step 5: Build the project and run unit tests (configured in build.gradle)
      - name: Run build and tests
        run: ./gradlew build

      # Step 6: Run Checkstyle to enforce code style guidelines
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      # Step 7: Run PMD for static analysis to detect potential code issues
      - name: Run PMD analysis
        run: ./gradlew pmdMain

      # Step 8: Run SpotBugs to find bugs by analyzing the compiled bytecode
      - name: Run SpotBugs analysis
        run: ./gradlew spotbugsMain

      # Step 9: Check code formatting with Spotless; this fails if the code is not formatted correctly
      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      # Step 10: Run tests again to generate a JaCoCo code coverage report
      - name: Run tests and generate coverage report
        run: ./gradlew test jacocoTestReport

      # Step 11: Run OWASP Dependency Check to scan for vulnerabilities in your dependencies
      - name: Run dependency vulnerability check
        run: ./gradlew dependencyCheckAnalyze

      # Step 12: Upload build reports and code coverage reports as artifacts for later review
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports
            build/jacoco/test/html
